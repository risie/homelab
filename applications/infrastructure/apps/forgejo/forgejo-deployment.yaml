apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: FORGEJO__server__DOMAIN
              value: "forgejo.cluster.local"
            - name: FORGEJO__server__ROOT_URL
              value: "http://$(FORGEJO__server__DOMAIN):3000/"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__database__DB_TYPE
              value: "postgres"
            - name: FORGEJO__database__HOST
              value: "postgres-service:5432"
            - name: FORGEJO__database__NAME
              value: "forgejo"
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: POSTGRES_USER
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: forgejo-storage
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: forgejo-storage
          persistentVolumeClaim:
            claimName: forgejo-pvc
