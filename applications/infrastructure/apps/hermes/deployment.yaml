apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
    spec:
      containers:
        - name: webui
          image: ghcr.io/nesquena/hermes-webui:latest
          ports:
            - containerPort: 8643
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
