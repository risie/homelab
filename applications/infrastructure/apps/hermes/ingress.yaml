apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-edge-router
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: hermes.cluster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-service
            port:
              number: 80
