apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes
  annotations:
    tailscale.com: "true"
spec:
  ingressClassName: tailscale
  rules:
    - host: hermes.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-service
                port:
                  number: 80
