apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-edge-router
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: n8n.cluster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n-internal-svc
            port:
              number: 80
